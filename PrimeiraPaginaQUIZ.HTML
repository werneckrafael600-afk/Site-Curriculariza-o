<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>
<style>
body{
    margin: 0;
    padding: 0;
    background-image: url("991.png");
    background-size: cover;
    background-position: center;
    font-family: "Arial", Sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 5px;
}
.container{
    width: 800px;
    padding: 20px;
    text-align: center;
    font-size: 35px;
}
h1{
    margin-bottom: 30px;
}
.avatares{
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 30px;
    
}
.avatar{
    text-align: center;
    
}
.avatar img{
    width: 150px;
    height: 150px;

}
.avatar p{
    background-color: #8b8b5a;
    padding: 5px;
    margin-top: 5px;
    border-radius: 10px;
    font-size: 35;
}
.selecionado{
    border: 4px solid #ffd700;
    background-color: rgba(255,255,255,0.2);
    transform: scale(1.05);
}
.formulario{
    display: flex;
    flex-direction: column;
    gap: 15px;
    height: 300px;

   
}
input{
    padding: 10px;
    background-color: #8b8b5a;
    border-radius: 10px;
    height: 150px;
}
input::placeholder {
    color: rgb(73, 73, 73);
}
button{
    padding: 10px 20px;
    background-color: #8b8b5a;
    border-radius: 10px;
    color: #000000;
    cursor: pointer;
    font-size: 20px;
     font-family: "Copperplate", fantasy;
   

}
</style>
</head>
<body>
<div class="container">
    <h1>ESCOLHA SEU AVATAR</h1>
    <div class="avatares">
        <div class="avatar" onclick="selecionarAvatar('Feminino.png', this)">
            <img src="Feminino.png">
            <p>FEMININO</p>
        </div>
        <div class="avatar" onclick="selecionarAvatar('Masculino.png', this)">
            <img src="Masculino.png">
            <p>MASCULINO</p>
        </div>
    </div>
    <div class="formulario">
        <input id="nome" type="text" placeholder="Nome">
        <input type="text" placeholder="Escola">
        <input type="text" placeholder="Idade">
        <br>
        <button onclick="iniciarQuiz()">INICIAR QUIZ</button>
    </div>
</div>>
<script>
let avatarEscolhido = "";
function selecionarAvatar(imagem, elemento){
    avatarEscolhido = imagem;
    document.querySelectorAll(".avatar").forEach(avatar => {
        avatar.classList.remove("selecionado");
    });
    elemento.classList.add("selecionado");
}
function iniciarQuiz(){
    let nome = document.getElementById("nome").value;
    if(nome === ""){
        alert("Digite seu nome!");
        return;
    }
    if(avatarEscolhido === ""){
        alert("Escolha um avatar!");
        return;
    }
    localStorage.setItem("nomeJogador", nome);
    localStorage.setItem("avatarJogador", avatarEscolhido);
    window.location.href = "Pergunta1Quiz.html";
}
</script>
</body>
</html>
